name: Publish reviewed data patch
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/data_platform_v4/patches/**'
      - '.github/workflows/publish-reviewed-data.yml'
permissions:
  contents: read
jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/restore-pr13-complete'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply reviewed hash-pinned patch
        run: |
          python3 tools/data_platform_v4/apply_reviewed_patch.py tools/data_platform_v4/patches/v4-2026-09-28.1.json
          python3 tools/data_platform_v4/verify_game_data_v4_freeze.py
          python3 -m unittest discover -s tools/data_platform_v4 -p 'test_reviewed_patch.py'
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('assets/runtime/linkball_game_data_v4.sqlite').read_bytes()).hexdigest() == '7e8f5e8695397f7f4053a47074edea264565cddd456d28515791322f4928517f'
          PY
      - name: Commit only the reviewed data package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime/linkball_game_data_v4.sqlite assets/runtime/linkball_game_data_v4_manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified Vlahovic data revision v4-2026-09-28.1'
          git push origin HEAD:refs/heads/codex/restore-pr13-complete
