name: Android signing checks

on:
  pull_request:
    paths:
      - android/app/build.gradle.kts
      - tools/build_local_apk.ps1
      - .github/workflows/android-signing.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build local release APK through PowerShell
        shell: pwsh
        run: |
          ./tools/build_local_apk.ps1 -TargetPlatform android-arm64
          if (Test-Path Env:ORG_GRADLE_PROJECT_linkballLocalApk) {
            throw "Local signing opt-in leaked out of the script."
          }
      - name: Verify local certificate and fail-closed signing checks
        shell: bash
        run: |
          set -euo pipefail
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --print-certs build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/local-cert.txt"
          grep -q 'CN=Android Debug' "$RUNNER_TEMP/local-cert.txt"
          cd android
          if ./gradlew :app:validateSigningRelease > "$RUNNER_TEMP/missing-key.log" 2>&1; then
            echo 'Release unexpectedly succeeded without a keystore'; exit 1
          fi
          grep -q 'Linkball release signing is not configured' "$RUNNER_TEMP/missing-key.log"
          if ./gradlew :app:bundleRelease -PlinkballLocalApk=true > "$RUNNER_TEMP/local-bundle.log" 2>&1; then
            echo 'Local test signing unexpectedly allowed an AAB'; exit 1
          fi
          grep -q 'for local APK testing only' "$RUNNER_TEMP/local-bundle.log"
          printf 'storeFile=missing.jks\nkeyAlias=upload\n' > key.properties
          if ./gradlew :app:validateSigningRelease > "$RUNNER_TEMP/partial-key.log" 2>&1; then
            echo 'Release unexpectedly accepted incomplete signing'; exit 1
          fi
          grep -q 'Missing properties: storePassword, keyPassword' "$RUNNER_TEMP/partial-key.log"
          rm key.properties
      - name: Verify a configured upload key still signs release APKs
        shell: bash
        run: |
          set -euo pipefail
          # Ephemeral CI-only certificate, never a production key.
          keytool -genkeypair -keystore android/app/ci-signing.jks -storepass ci-test-only -keypass ci-test-only -alias upload -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Linkball CI Signing Test' -noprompt
          printf 'storeFile=ci-signing.jks\nstorePassword=ci-test-only\nkeyPassword=ci-test-only\nkeyAlias=upload\n' > android/key.properties
          flutter build apk --release --target-platform android-arm64
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --print-certs build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/upload-cert.txt"
          grep -q 'CN=Linkball CI Signing Test' "$RUNNER_TEMP/upload-cert.txt"
      - name: Remove ephemeral signing files
        if: always()
        run: rm -f android/key.properties android/app/ci-signing.jks
