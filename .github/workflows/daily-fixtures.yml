    "clubs_removed": 3091,
    "transfer_rows_removed": 13250,
    "clubs_remaining": 4311,
    "transfers_remaining": 33993
  },
  "contracts": {
    "playerUniverse": 30135,
    "clubIdNamespace": {
      "existing": "source ID unchanged",
      "tm": "1_000_000_000 + source ID",
      "fallback": "2_000_000_000 + V3 internal ID"
    },
    "playerClubPolicy": "V3 primary; normalized RAW fallback for exactly 33 players",
    "careerPolicy": "Normalized V3 career_spells only",
    "legacyPoolsCopied": false,
    "runtimeJsonRequired": false
  },
  "revision": "v4-2026-09-29.1",
  "updatedUtc": "2026-09-29T11:13:59.307059+00:00",
  "patches": [
    {
      "id": "v4-2026-09-28.1",
      "baseSha256": "c749fe3163cdc36f0ffc61222bf4b6ae90d2215463461636f6fbc11984a0d54f",
      "outputSha256": "dad40bb41b20405e12f309acec9a7c88dd356753024992e55b5646f1eff6f5db",
      "definition": "v4-2026-09-28.1.json"
    },
    {
      "id": "v4-2026-09-29.1",
      "baseSha256": "dad40bb41b20405e12f309acec9a7c88dd356753024992e55b5646f1eff6f5db",
      "outputSha256": "1f6a125d3402188d5c5e53d3c05697d4f9a26b99a0959b4a6ff70cd792336b9c",
