# Her gun 00:30 UTC (~03:30 Turkiye) bugun+yarin fiksturlerini RTDB'ye yazar.
name: Sync Daily Fixtures

on:
  push:
    branches: [codex/restore-pr13-complete]
    paths:
      - tools/data_platform_v4/apply_notable_players.py
      - tools/data_platform_v4/patches/notable-players-2026-09-30.json
  schedule:
    # UTC 00:30 = yazin 03:30 TR, kisin 03:30 TR (UTC+3)
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Opsiyonel tek gun YYYY-MM-DD (bos = bugun+yarin)"
        required: false
        default: ""

jobs:
  sync:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/codex/restore-pr13-complete')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install script deps
        run: |
          cd scripts
          npm init -y
          npm install firebase-admin@^13

      - name: Run sync
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIXTURE_DATE: ${{ github.event.inputs.date }}
        run: node scripts/sync-daily-fixtures.js

  roster_publish:
    name: Publish reviewed player corrections
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/codex/restore-pr13-complete'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: codex/restore-pr13-complete
      - name: Apply and verify reviewed player corrections
        run: |
          python3 tools/data_platform_v4/apply_notable_players.py
          python3 tools/data_platform_v4/verify_game_data_v4_freeze.py
          python3 -m unittest discover -s tools/data_platform_v4 -p 'test_*.py'
      - name: Commit verified data package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime/linkball_game_data_v4.sqlite assets/runtime/linkball_game_data_v4_manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish reviewed notable players and club links v4-2026-09-30.1'
          git push origin HEAD:refs/heads/codex/restore-pr13-complete
