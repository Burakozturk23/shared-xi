# Her gun 00:30 UTC (~03:30 Turkiye) bugun+yarin fiksturlerini RTDB'ye yazar.
name: Sync Daily Fixtures

on:
  schedule:
    # UTC 00:30 = yazin 03:30 TR, kisin 03:30 TR (UTC+3)
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Opsiyonel tek gun YYYY-MM-DD (bos = bugun+yarin)"
        required: false
        default: ""

jobs:
  sync:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/codex/restore-pr13-complete'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install script deps
        run: |
          cd scripts
          npm init -y
          npm install firebase-admin@^13

      - name: Run sync
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIXTURE_DATE: ${{ github.event.inputs.date }}
        run: node scripts/sync-daily-fixtures.js

  roster_publish:
    name: Publish reviewed roster expansion
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/restore-pr13-complete'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: codex/restore-pr13-complete
      - name: Restore the hash-pinned base manifest when needed
        run: |
          if [ "$(sha256sum assets/runtime/linkball_game_data_v4.sqlite | cut -d' ' -f1)" = "1f6a125d3402188d5c5e53d3c05697d4f9a26b99a0959b4a6ff70cd792336b9c" ]; then
            cat > assets/runtime/linkball_game_data_v4_manifest.json <<'BASE_MANIFEST'
{
  "schemaVersion": "4",
  "dataVersion": "v4",
  "compilerStep": "08D.8A",
  "generatedUtc": "2026-08-31T23:35:30.578736+00:00",
  "database": {
    "asset": "assets/runtime/linkball_game_data_v4.sqlite",
    "bytes": 37478400,
    "sizeMB": 35.74,
    "sha256": "1f6a125d3402188d5c5e53d3c05697d4f9a26b99a0959b4a6ff70cd792336b9c"
  },
  "counts": {
