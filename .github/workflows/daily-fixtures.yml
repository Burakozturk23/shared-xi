          fi
      - name: Apply and verify reviewed roster expansion
        run: |
          python3 tools/data_platform_v4/apply_roster_expansion.py tools/data_platform_v4/patches/roster-expansion-2026-09-29.json
          python3 tools/data_platform_v4/verify_game_data_v4_freeze.py
          python3 -m unittest discover -s tools/data_platform_v4 -p 'test_*.py'
      - name: Commit verified data package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime/linkball_game_data_v4.sqlite assets/runtime/linkball_game_data_v4_manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified current roster expansion v4-2026-09-29.2'
          git push origin HEAD:refs/heads/codex/restore-pr13-complete
