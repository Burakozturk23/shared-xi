name: Publish season portraits

on:
  push:
    branches:
      - codex/player-portraits-avatar-refresh
    paths:
      - "tools/season_portraits/**"
      - ".github/workflows/publish-season-portraits.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-season-portraits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[season-portraits-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: codex/player-portraits-avatar-refresh
          fetch-depth: 0

      - name: Download approved Behance season portraits
        run: python3 tools/season_portraits/publish.py

      - name: Verify all requested players exist in V4
        run: python3 tools/season_portraits/verify_players.py

      - name: Commit generated portrait assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/season_portraits lib/data/season_portrait_catalog.dart
          if git diff --cached --quiet; then
            echo "No portrait changes to publish."
            exit 0
          fi
          git commit -m "assets: publish 2012-14 player portraits [season-portraits-generated]"
          git push origin HEAD:codex/player-portraits-avatar-refresh
