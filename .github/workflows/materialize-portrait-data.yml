name: Materialize portrait player data

on:
  push:
    branches:
      - codex/player-portraits-avatar-refresh

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[portrait-data-materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/player-portraits-avatar-refresh
          fetch-depth: 0
      - name: Apply reviewed portrait player patch
        run: |
          python3 tools/data_platform_v4/apply_notable_players.py
          python3 tools/data_platform_v4/apply_legend_portrait_players.py
          python3 -m unittest discover -s tools/data_platform_v4 -p 'test_legend_portrait_players.py'
          python3 tools/data_platform_v4/export_daily_catalog.py
      - name: Commit materialized runtime data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/runtime/linkball_game_data_v4.sqlite assets/runtime/linkball_game_data_v4_manifest.json functions/config/daily_catalog.json; then
            echo "Runtime data already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/runtime/linkball_game_data_v4.sqlite assets/runtime/linkball_game_data_v4_manifest.json functions/config/daily_catalog.json
          git commit -m "data: materialize 21 portrait players and 83 links [portrait-data-materialized]"
          git push origin HEAD:codex/player-portraits-avatar-refresh
