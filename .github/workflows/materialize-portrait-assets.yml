name: Materialize approved portrait assets

on:
  push:
    branches:
      - codex/player-portraits-avatar-refresh

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[portrait-assets-materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/player-portraits-avatar-refresh
          fetch-depth: 0
      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Fetch approved source artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/portrait-sources
          curl -L --fail --retry 3 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj8_b8sFAtOLJPBkF_Rb7aYKIsFNpdTu8HgOgSOZHbWMiyYzDb9yn__9YxaTTd6YRBl4ot4iRhhUJHLJpHNcBGcFWQaQ8ZYJ5ToWdbu-R2TuCciiIWeuSlWaLFTqEOkrZeFQiY9_X-vOps/s1600/2015%2BMathieu%2BMarcou%2B-%2B50%2BFavourite%2BPlayers%2B-002.jpg' -o build/portrait-sources/overview-002.jpg
          curl -L --fail --retry 3 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg3Lg1S7Lzs-jv7ynxgt6Mdibr7BQy9OPdRuJl1XQUIHNYFQvJp7ZpmSzwugHyGIQMOwqE9xVzPlAHhRnPDYkUyJYwReiekXLGe7MBJAJu0IjDeEbHT-U0gdoyY8nBhG4Cn4SqiHJsnEuo/s1600/2015%2BMathieu%2BMarcou%2B-%2B50%2BFavourite%2BPlayers%2B-003.jpg' -o build/portrait-sources/overview-003.jpg
      - name: Build 50 runtime portraits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          src = Path('build/portrait-sources')
          out = Path('assets/player_portraits')
          out.mkdir(parents=True, exist_ok=True)
          target = (256, 356)

          sheets = [src/'overview-002.jpg', src/'overview-003.jpg']
          for path in sheets:
              with Image.open(path) as im:
                  if im.width < 500 or im.height < 700:
                      raise SystemExit(f'Unexpected source sheet size for {path}: {im.size}')

          # The published overview sheets are a 5x5 interleaving of the Behance
          # list: sheet 002 carries 1-5, 11-15, ... 41-45; sheet 003 carries
          # 6-10, 16-20, ... 46-50.
          for sheet_offset, sheet_path in [(0, sheets[0]), (5, sheets[1])]:
              with Image.open(sheet_path) as raw:
                  sheet = raw.convert('RGB')
                  for row in range(5):
                      for col in range(5):
                          index = row * 10 + sheet_offset + col + 1
                          x0 = round(col * sheet.width / 5)
                          x1 = round((col + 1) * sheet.width / 5)
                          y0 = round(row * sheet.height / 5)
                          y1 = round((row + 1) * sheet.height / 5)
                          cell = sheet.crop((x0, y0, x1, y1))
                          portrait = ImageOps.fit(
                              cell, target, method=Image.Resampling.LANCZOS
                          )
                          portrait.save(
                              out/f'legend_{index:02d}.jpg',
                              quality=90,
                              optimize=True,
                              progressive=True,
                          )

          files = sorted(out.glob('legend_*.jpg'))
          if len(files) != 50:
              raise SystemExit(f'Expected 50 portraits, found {len(files)}')
          for path in files:
              with Image.open(path) as im:
                  if im.size != target:
                      raise SystemExit(f'Unexpected size for {path}: {im.size}')
          print('source sheets:', [str(p) for p in sheets])
          print('portrait files:', len(files))
          PY
      - name: Commit portrait assets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- assets/player_portraits)" ]; then
            echo 'Portrait assets already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/player_portraits
          git commit -m 'assets: materialize 50 approved portraits [portrait-assets-materialized]'
          git push origin HEAD:codex/player-portraits-avatar-refresh
