name: Materialize reviewed portrait audit data

on:
  push:
    branches: [codex/player-portraits-avatar-refresh]
    paths: [.github/workflows/materialize-portrait-audit.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/player-portraits-avatar-refresh
      - name: Apply and verify the reviewed four-player patch
        run: |
          python3 tools/data_platform_v4/apply_portrait_audit_players.py
          python3 tools/data_platform_v4/verify_game_data_v4_freeze.py
          python3 tools/season_portraits/verify_players.py
          python3 -m unittest discover -s tools/data_platform_v4 -p 'test_portrait_audit_players.py'
      - name: Commit the bundled data on the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime/linkball_game_data_v4.sqlite assets/runtime/linkball_game_data_v4_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize reviewed portrait audit player data'
            git push origin HEAD:codex/player-portraits-avatar-refresh
          fi
