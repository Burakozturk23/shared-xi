name: Linkball CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: linkball-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bundled data and reviewed patches
        run: |
          python3 tools/data_platform_v4/verify_game_data_v4_freeze.py
          python3 -m unittest discover -s tools/data_platform_v4 -p 'test_reviewed_patch.py'
          python3 -m unittest discover -s tools/data_platform_v4 -p 'test_api_football_sync.py'
          python3 -m unittest discover -s tools/data_platform_v4 -p 'test_roster_patch.py'
          python3 -m unittest discover -s tools/data_platform_v4 -p 'test_roster_expansion.py'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze app and tests
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib test integration_test

      - name: Run Flutter tests
        run: flutter test --reporter expanded --dart-define=UPDATE_FIVE_SCREENSHOTS=true

      - name: Upload Random Five widget previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: random-five-previews
          path: .dart_tool/five_qa/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload visual identity previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-identity-previews
          path: .dart_tool/identity_qa/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Grid previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-previews
          path: .dart_tool/grid_qa/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload social screen previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-screen-previews
          path: .dart_tool/social_qa/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload player experience previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-experience-previews
          path: .dart_tool/experience_qa/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload store previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-previews
          path: .dart_tool/store_qa/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Android debug compile gate
        run: flutter build apk --debug

  functions:
    name: Firebase Functions quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci

      - name: Lint Functions
        run: npm run lint

      - name: Test Functions contracts
        run: npm test

  integration:
    name: Android integration smoke
    if: github.event_name != 'pull_request'
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Android integration smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/welcome_smoke_test.dart -d emulator-5554

  release_aab:
    name: Signed release AAB
    if: github.event_name != 'pull_request'
    needs:
      - flutter
      - functions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LINKBALL_UPLOAD_KEYSTORE_BASE64: ${{ secrets.LINKBALL_UPLOAD_KEYSTORE_BASE64 }}
      LINKBALL_UPLOAD_STORE_PASSWORD: ${{ secrets.LINKBALL_UPLOAD_STORE_PASSWORD }}
      LINKBALL_UPLOAD_KEY_ALIAS: ${{ secrets.LINKBALL_UPLOAD_KEY_ALIAS }}
      LINKBALL_UPLOAD_KEY_PASSWORD: ${{ secrets.LINKBALL_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify signing secrets
        shell: bash
        run: |
          test -n "$LINKBALL_UPLOAD_KEYSTORE_BASE64"
          test -n "$LINKBALL_UPLOAD_STORE_PASSWORD"
          test -n "$LINKBALL_UPLOAD_KEY_ALIAS"
          test -n "$LINKBALL_UPLOAD_KEY_PASSWORD"

      - name: Restore upload signing configuration
        shell: python
        run: |
          import base64
          import os
          from pathlib import Path

          root = Path.cwd()
          app = root / "android" / "app"
          app.mkdir(parents=True, exist_ok=True)

          raw = base64.b64decode(
              os.environ["LINKBALL_UPLOAD_KEYSTORE_BASE64"],
              validate=True,
          )
          (app / "upload-keystore.jks").write_bytes(raw)

          def prop(value):
              return (
                  value
                  .replace("\\", "\\\\")
                  .replace("\r", "\\r")
                  .replace("\n", "\\n")
                  .replace("=", "\\=")
                  .replace(":", "\\:")
              )

          properties = [
              "storeFile=upload-keystore.jks",
              "storePassword=" + prop(
                  os.environ["LINKBALL_UPLOAD_STORE_PASSWORD"]
              ),
              "keyAlias=" + prop(
                  os.environ["LINKBALL_UPLOAD_KEY_ALIAS"]
              ),
              "keyPassword=" + prop(
                  os.environ["LINKBALL_UPLOAD_KEY_PASSWORD"]
              ),
          ]

          (root / "android" / "key.properties").write_text(
              "\n".join(properties) + "\n",
              encoding="utf-8",
          )

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build signed Play Store AAB
        run: flutter build appbundle --release

      - name: Verify AAB exists
        shell: bash
        run: test -s build/app/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkball-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  roster_publish:
    name: Publish reviewed roster expansion
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'codex/roster-publish-trigger')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Restore the hash-pinned base manifest when needed
        run: |
          if [ "$(sha256sum assets/runtime/linkball_game_data_v4.sqlite | cut -d' ' -f1)" = "1f6a125d3402188d5c5e53d3c05697d4f9a26b99a0959b4a6ff70cd792336b9c" ]; then
            cat > assets/runtime/linkball_game_data_v4_manifest.json <<'BASE_MANIFEST'
{
  "schemaVersion": "4",
  "dataVersion": "v4",
  "compilerStep": "08D.8A",
  "generatedUtc": "2026-08-31T23:35:30.578736+00:00",
  "database": {
    "asset": "assets/runtime/linkball_game_data_v4.sqlite",
    "bytes": 37478400,
    "sizeMB": 35.74,
    "sha256": "1f6a125d3402188d5c5e53d3c05697d4f9a26b99a0959b4a6ff70cd792336b9c"
  },
  "counts": {
    "players": 30135,
    "unique_player_ids": 30135,
    "shadow_players": 0,
    "players_with_clubs": 30135,
    "clubs": 4311,
    "career_players": 6962,
    "transfer_players": 4586,
    "search_players": 30135,
    "coaches": 5275,
    "transfers": 33994
  },
  "pruning": {
    "step": "08D.7O",
    "policy": "transfer_only_development_v1",
    "clubs_removed": 3091,
    "transfer_rows_removed": 13250,
    "clubs_remaining": 4311,
    "transfers_remaining": 33993
  },
  "contracts": {
    "playerUniverse": 30135,
    "clubIdNamespace": {
      "existing": "source ID unchanged",
      "tm": "1_000_000_000 + source ID",
      "fallback": "2_000_000_000 + V3 internal ID"
    },
    "playerClubPolicy": "V3 primary; normalized RAW fallback for exactly 33 players",
    "careerPolicy": "Normalized V3 career_spells only",
    "legacyPoolsCopied": false,
    "runtimeJsonRequired": false
  },
  "revision": "v4-2026-09-29.1",
  "updatedUtc": "2026-09-29T11:13:59.307059+00:00",
  "patches": [
    {
      "id": "v4-2026-09-28.1",
      "baseSha256": "c749fe3163cdc36f0ffc61222bf4b6ae90d2215463461636f6fbc11984a0d54f",
      "outputSha256": "dad40bb41b20405e12f309acec9a7c88dd356753024992e55b5646f1eff6f5db",
      "definition": "v4-2026-09-28.1.json"
    },
    {
      "id": "v4-2026-09-29.1",
      "baseSha256": "dad40bb41b20405e12f309acec9a7c88dd356753024992e55b5646f1eff6f5db",
      "outputSha256": "1f6a125d3402188d5c5e53d3c05697d4f9a26b99a0959b4a6ff70cd792336b9c",
      "definition": "v4-2026-09-29.1.json"
    }
  ]
}
BASE_MANIFEST
          fi
      - name: Apply and verify reviewed roster expansion
        run: |
          python3 tools/data_platform_v4/apply_roster_expansion.py tools/data_platform_v4/patches/roster-expansion-2026-09-29.json
          python3 tools/data_platform_v4/verify_game_data_v4_freeze.py
          python3 -m unittest discover -s tools/data_platform_v4 -p 'test_*.py'
      - name: Commit verified data package to release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime/linkball_game_data_v4.sqlite assets/runtime/linkball_game_data_v4_manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified current roster expansion v4-2026-09-29.2'
          git push origin HEAD:refs/heads/codex/restore-pr13-complete
