name: Linkball CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: linkball-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze app and tests
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib test integration_test

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Android debug compile gate
        run: flutter build apk --debug

  functions:
    name: Firebase Functions quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci

      - name: Lint Functions
        run: npm run lint

      - name: Test Functions contracts
        run: npm test

  integration:
    name: Android integration smoke
    if: github.event_name != 'pull_request'
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Android integration smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/welcome_smoke_test.dart -d emulator-5554

  release_aab:
    name: Signed release AAB
    if: github.event_name != 'pull_request'
    needs:
      - flutter
      - functions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LINKBALL_UPLOAD_KEYSTORE_BASE64: ${{ secrets.LINKBALL_UPLOAD_KEYSTORE_BASE64 }}
      LINKBALL_UPLOAD_STORE_PASSWORD: ${{ secrets.LINKBALL_UPLOAD_STORE_PASSWORD }}
      LINKBALL_UPLOAD_KEY_ALIAS: ${{ secrets.LINKBALL_UPLOAD_KEY_ALIAS }}
      LINKBALL_UPLOAD_KEY_PASSWORD: ${{ secrets.LINKBALL_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify signing secrets
        shell: bash
        run: |
          test -n "$LINKBALL_UPLOAD_KEYSTORE_BASE64"
          test -n "$LINKBALL_UPLOAD_STORE_PASSWORD"
          test -n "$LINKBALL_UPLOAD_KEY_ALIAS"
          test -n "$LINKBALL_UPLOAD_KEY_PASSWORD"

      - name: Restore upload signing configuration
        shell: python
        run: |
          import base64
          import os
          from pathlib import Path

          root = Path.cwd()
          app = root / "android" / "app"
          app.mkdir(parents=True, exist_ok=True)

          raw = base64.b64decode(
              os.environ["LINKBALL_UPLOAD_KEYSTORE_BASE64"],
              validate=True,
          )
          (app / "upload-keystore.jks").write_bytes(raw)

          def prop(value):
              return (
                  value
                  .replace("\\", "\\\\")
                  .replace("\r", "\\r")
                  .replace("\n", "\\n")
                  .replace("=", "\\=")
                  .replace(":", "\\:")
              )

          properties = [
              "storeFile=upload-keystore.jks",
              "storePassword=" + prop(
                  os.environ["LINKBALL_UPLOAD_STORE_PASSWORD"]
              ),
              "keyAlias=" + prop(
                  os.environ["LINKBALL_UPLOAD_KEY_ALIAS"]
              ),
              "keyPassword=" + prop(
                  os.environ["LINKBALL_UPLOAD_KEY_PASSWORD"]
              ),
          ]

          (root / "android" / "key.properties").write_text(
              "\n".join(properties) + "\n",
              encoding="utf-8",
          )

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build signed Play Store AAB
        run: flutter build appbundle --release

      - name: Verify AAB exists
        shell: bash
        run: test -s build/app/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkball-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
