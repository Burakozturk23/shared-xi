name: Linkball CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: linkball-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload portrait work base data
        uses: actions/upload-artifact@v4
        with:
          name: portrait-work-base
          path: |
            assets/runtime/linkball_game_data_v4.sqlite
            assets/runtime/linkball_game_data_v4_manifest.json
          if-no-files-found: error
          retention-days: 1

      - name: Fetch five missing legendary portraits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/legend-portraits
          curl -L --fail --retry 3 'https://www.sport24.gr/wp-content/uploads/2016/03/263ff730205511.5617dbcf6e0d0-full.jpg' -o build/legend-portraits/46-jean-pierre-papin.jpg
          curl -L --fail --retry 3 'https://www.sport24.gr/wp-content/uploads/2016/03/911ab830205511.5617dbcf62a98-full.jpg' -o build/legend-portraits/47-paul-scholes.jpg
          curl -L --fail --retry 3 'https://www.sport24.gr/wp-content/uploads/2016/03/a4b66a30205511.5617dbcf554c2-full.jpg' -o build/legend-portraits/48-pep-guardiola.jpg
          curl -L --fail --retry 3 'https://www.sport24.gr/wp-content/uploads/2016/03/4a1b8430205511.5617dbcf70032-full.jpg' -o build/legend-portraits/49-socrates.jpg
          curl -L --fail --retry 3 'https://www.sport24.gr/wp-content/uploads/2016/03/35a0da30205511.5617dbcf7733a-full.jpg' -o build/legend-portraits/50-paolo-maldini.jpg
          curl -L --fail --retry 3 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj8_b8sFAtOLJPBkF_Rb7aYKIsFNpdTu8HgOgSOZHbWMiyYzDb9yn__9YxaTTd6YRBl4ot4iRhhUJHLJpHNcBGcFWQaQ8ZYJ5ToWdbu-R2TuCciiIWeuSlWaLFTqEOkrZeFQiY9_X-vOps/s1600/2015%2BMathieu%2BMarcou%2B-%2B50%2BFavourite%2BPlayers%2B-002.jpg' -o build/legend-portraits/overview-002.jpg
          curl -L --fail --retry 3 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg3Lg1S7Lzs-jv7ynxgt6Mdibr7BQy9OPdRuJl1XQUIHNYFQvJp7ZpmSzwugHyGIQMOwqE9xVzPlAHhRnPDYkUyJYwReiekXLGe7MBJAJu0IjDeEbHT-U0gdoyY8nBhG4Cn4SqiHJsnEuo/s1600/2015%2BMathieu%2BMarcou%2B-%2B50%2BFavourite%2BPlayers%2B-003.jpg' -o build/legend-portraits/overview-003.jpg

      - name: Upload five missing legendary portraits
        uses: actions/upload-artifact@v4
        with:
          name: legend-portraits-missing
          path: build/legend-portraits/*.jpg
          if-no-files-found: error
          retention-days: 1

      - name: Verify bundled data and reviewed patches
        run: |
          python3 tools/data_platform_v4/apply_notable_players.py
          python3 tools/data_platform_v4/apply_legend_portrait_players.py
          python3 tools/data_platform_v4/verify_game_data_v4_freeze.py
          python3 -m unittest discover -s tools/data_platform_v4 -p 'test_reviewed_patch.py'
          python3 -m unittest discover -s tools/data_platform_v4 -p 'test_api_football_sync.py'
          python3 -m unittest discover -s tools/data_platform_v4 -p 'test_roster_patch.py'
          python3 -m unittest discover -s tools/data_platform_v4 -p 'test_roster_expansion.py'
          python3 -m unittest discover -s tools/data_platform_v4 -p 'test_notable_players.py'
          python3 -m unittest discover -s tools/data_platform_v4 -p 'test_legend_portrait_players.py'

      - name: Verify daily answer catalog matches the bundled database
        run: |
          python3 tools/data_platform_v4/export_daily_catalog.py
          git diff --exit-code -- functions/config/daily_catalog.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze app and tests
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib test integration_test

      - name: Run Flutter tests
        run: flutter test --reporter expanded --dart-define=UPDATE_FIVE_SCREENSHOTS=true

      - name: Upload Random Five widget previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: random-five-previews
          path: .dart_tool/five_qa/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload visual identity previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-identity-previews
          path: .dart_tool/identity_qa/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Grid previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-previews
          path: .dart_tool/grid_qa/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload social screen previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-screen-previews
          path: .dart_tool/social_qa/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload player experience previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-experience-previews
          path: .dart_tool/experience_qa/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload store previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-previews
          path: .dart_tool/store_qa/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload daily match previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-match-previews
          path: .dart_tool/daily_qa/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload season and badge previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-badge-previews
          path: .dart_tool/season_qa/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Android debug compile gate
        run: flutter build apk --debug

  functions:
    name: Firebase Functions quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci

      - name: Lint Functions
        run: npm run lint

      - name: Test Functions contracts
        run: npm test

  integration:
    name: Android integration smoke
    if: github.event_name != 'pull_request'
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Android integration smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/welcome_smoke_test.dart -d emulator-5554

  release_aab:
    name: Signed release AAB
    if: github.event_name != 'pull_request'
    needs:
      - flutter
      - functions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LINKBALL_UPLOAD_KEYSTORE_BASE64: ${{ secrets.LINKBALL_UPLOAD_KEYSTORE_BASE64 }}
      LINKBALL_UPLOAD_STORE_PASSWORD: ${{ secrets.LINKBALL_UPLOAD_STORE_PASSWORD }}
      LINKBALL_UPLOAD_KEY_ALIAS: ${{ secrets.LINKBALL_UPLOAD_KEY_ALIAS }}
      LINKBALL_UPLOAD_KEY_PASSWORD: ${{ secrets.LINKBALL_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify signing secrets
        shell: bash
        run: |
          test -n "$LINKBALL_UPLOAD_KEYSTORE_BASE64"
          test -n "$LINKBALL_UPLOAD_STORE_PASSWORD"
          test -n "$LINKBALL_UPLOAD_KEY_ALIAS"
          test -n "$LINKBALL_UPLOAD_KEY_PASSWORD"

      - name: Restore upload signing configuration
        shell: python
        run: |
          import base64
          import os
          from pathlib import Path

          root = Path.cwd()
          app = root / "android" / "app"
          app.mkdir(parents=True, exist_ok=True)

          raw = base64.b64decode(
              os.environ["LINKBALL_UPLOAD_KEYSTORE_BASE64"],
              validate=True,
          )
          (app / "upload-keystore.jks").write_bytes(raw)

          def prop(value):
              return (
                  value
                  .replace("\\", "\\\\")
                  .replace("\r", "\\r")
                  .replace("\n", "\\n")
                  .replace("=", "\\=")
                  .replace(":", "\\:")
              )

          properties = [
              "storeFile=upload-keystore.jks",
              "storePassword=" + prop(
                  os.environ["LINKBALL_UPLOAD_STORE_PASSWORD"]
              ),
              "keyAlias=" + prop(
                  os.environ["LINKBALL_UPLOAD_KEY_ALIAS"]
              ),
              "keyPassword=" + prop(
                  os.environ["LINKBALL_UPLOAD_KEY_PASSWORD"]
              ),
          ]

          (root / "android" / "key.properties").write_text(
              "\n".join(properties) + "\n",
              encoding="utf-8",
          )

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build signed Play Store AAB
        run: flutter build appbundle --release

      - name: Verify AAB exists
        shell: bash
        run: test -s build/app/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkball-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
