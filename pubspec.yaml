name: shared_xi
description: "A football connection game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  firebase_analytics: 12.4.6
  firebase_crashlytics: 5.2.7
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  firebase_auth: 6.5.7
  cloud_functions: ^6.3.6
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  provider: ^6.1.5
  firebase_core: 4.13.0
  firebase_database: ^12.4.7
  firebase_app_check: 0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # STEP 07A.10C: explicit production data assets.
    # Full players.json/clubs.json remain in repo but are excluded
    # from APK/AAB to avoid shipping redundant full datasets.
    - assets/data/clubs_min.json
    - assets/data/coaches_min.json
    - assets/data/famous_transfers.json
    - assets/data/meta.json
    - assets/data/players_min.json
    - assets/runtime/
    - assets/logos/leagues/
    - assets/avatars/
    - assets/badges/
